<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tosche Registry — Citizenship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <p class="credit">by Froby</p>
  <div class="masthead-inner">
    <p class="eyebrow">Kingdom of Tosche &middot; Stoneworks</p>
    <h1>Citizenship</h1>
    <p class="subtitle">Trial Citizens and full Citizens of the realm.</p>
  </div>
  <div class="masthead-stats" id="masthead-stats" aria-live="polite">
    <div class="stat">
      <span class="stat-value" id="stat-total">&mdash;</span>
      <span class="stat-label">citizens recorded</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-ranked">&mdash;</span>
      <span class="stat-label">hold office</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-updated">&mdash;</span>
      <span class="stat-label">last refreshed</span>
    </div>
  </div>
  <nav class="nav">
    <a href="index.html">Citizens</a>
    <a href="timezones.html">Timezones</a>
    <a href="citizenship.html" class="active">Citizenship</a>
    <a href="other.html">Other Roles</a>
  </nav>
</header>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Search by name..." autocomplete="off">
    </div>
  </div>

  <div class="filter-bar" id="filter-bar"></div>

  <div id="registry-status" class="registry-status" hidden></div>

  <table class="ledger" id="ledger-table">
    <thead>
      <tr>
        <th class="col-portrait" aria-hidden="true"></th>
        <th class="col-name">Name</th>
        <th class="col-station">Station</th>
        <th class="col-recruiter">Recruited by</th>
      </tr>
    </thead>
    <tbody id="ledger-body"></tbody>
  </table>
</main>

<div class="detail-overlay" id="detail-overlay" hidden>
  <div class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-name">
    <button class="detail-close" id="detail-close" aria-label="Close">&times;</button>
    <div class="detail-content" id="detail-content"></div>
  </div>
</div>

<footer>
  <p>The Tosche Registry &middot; maintained by decree of the Crown</p>
</footer>

<script src="config.js"></script>
<script>window.TOSCHE_PAGE = "citizenship";</script>
<script src="registry.js"></script>
</body>
</html>
