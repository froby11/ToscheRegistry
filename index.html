<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tosche Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-logo"><span class="crest">&#9670;</span>The Tosche Registry</span>
  <nav class="topbar-nav">
    <a href="index.html" class="active">Citizens</a>
    <a href="claims.html">Claims</a>
    <a href="overview.html">Overview</a>
  </nav>
  <span class="topbar-credit">By: Froby</span>
</header>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Search by name..." autocomplete="off">
    </div>
    <div class="toolbar-stats" aria-live="polite">
      <span id="stat-total">&mdash;</span> citizens tracked &middot;
      <span id="stat-shown">&mdash;</span> currently shown &middot;
      sorting by: <span id="stat-sorting">Name</span> &middot;
      updated <span id="stat-updated">&mdash;</span>
    </div>
  </div>

  <div id="registry-status" class="registry-status" hidden></div>

  <table class="ledger" id="ledger-table">
    <thead>
      <tr>
        <th class="col-portrait" aria-hidden="true"></th>
        <th class="col-name">Name</th>
        <th class="col-filterable" data-column="citystate"></th>
        <th class="col-filterable" data-column="timezone"></th>
        <th class="col-filterable" data-column="citizenship"></th>
        <th class="col-filterable" data-column="other"></th>
        <th class="col-activity" id="th-activity"></th>
        <th class="col-address">Address</th>
        <th class="col-recruiter">Recruited by</th>
      </tr>
    </thead>
    <tbody id="ledger-body"></tbody>
  </table>

  <div class="pagination" id="pagination"></div>
</main>

<div class="rank-overlay" id="rank-overlay" hidden>
  <div class="rank-panel" id="rank-panel" role="dialog" aria-modal="true">
    <button class="detail-close" id="rank-close" aria-label="Close">&times;</button>
    <h2 id="rank-title">Rank order</h2>
    <p class="rank-hint">Use the arrows to set highest → lowest sort order.</p>
    <ol class="rank-list" id="rank-list"></ol>
    <div class="rank-actions">
      <button class="rank-apply-btn" id="rank-apply">Apply sort</button>
      <button class="rank-cancel-btn" id="rank-cancel">Cancel</button>
    </div>
  </div>
</div>



<script src="config.js"></script>
<script src="registry.js"></script>
</body>
</html>
